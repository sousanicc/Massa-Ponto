<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de pedidos - Massa & Ponto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header class="header" role="banner">
        <div class="header-conteudo">
            <a href="/" class="logo" aria-label="Massa & Ponto - Página inicial">
                <span class="logo-parte">Massa</span>
                <span class="logo-e">&</span>
                <span class="logo-parte">Ponto</span>
                <span class="logo-ponto" aria-hidden="true">.</span>
            </a>
            <nav class="header-nav" aria-label="Navegação principal">
                <a href="/sacola" class="header-sacola" aria-label="Ver sacola">
                    <span class="header-sacola-icone" aria-hidden="true">🛒</span>
                    <span class="header-sacola-quantidade" th:text="${sacola.quantidadeTotal}">0</span>
                </a>
                <a href="/pedidos" class="header-pedidos" aria-label="Ver histórico de pedidos">Pedidos</a>
            </nav>
        </div>
    </header>

    <main class="principal">
        <section class="secao-pedidos" aria-labelledby="titulo-historico">
            <h2 id="titulo-historico" class="secao-titulo">Meus pedidos</h2>

            <div th:if="${pedidos.empty}">
                <div class="pedidos-vazio">
                    <p class="pedidos-vazio-mensagem">Nenhum pedido ainda 🍕</p>
                    <a href="/" class="btn-adicionar">Fazer primeiro pedido</a>
                </div>
            </div>

            <div th:unless="${pedidos.empty}">
                <ul class="pedidos-lista" role="list">
                    <li class="pedido-card" th:each="pedido : ${pedidos}">
                        <header class="pedido-card-cabecalho">
                            <div class="pedido-card-topo">
                                <span class="pedido-card-numero" th:text="'#' + ${pedido.id}">#123</span>
                                <span class="pedido-card-data" th:text="${pedido.criadoEmFormatado}">25/11/2024 19:30</span>
                            </div>
                            <div class="pedido-card-meta">
                                <span class="pedido-card-cliente" th:text="${pedido.nomeCliente}">Nome</span>
                                <span class="pedido-card-forma" th:text="${pedido.formaPagamento?.getNomeExibicao()}">Pix</span>
                            </div>
                        </header>

                        <ul class="pedido-card-itens">
                            <li class="pedido-card-item" th:each="item : ${pedido.itens}">
                                <span class="pedido-card-item-nome" th:text="${item.produto.nome}"></span>
                                <span class="pedido-card-item-qtd" th:text="${item.quantidade} + 'x'"></span>
                                <span class="pedido-card-item-subtotal" th:text="${item.subtotalFormatado}"></span>
                            </li>
                        </ul>

                        <footer class="pedido-card-rodape">
                            <span class="pedido-card-total-label">Total</span>
                            <span class="pedido-card-total-valor" th:text="${pedido.totalFormatado}"></span>
                            <a th:href="@{/pedido/{id}(id=${pedido.id})}" class="btn-voltar btn-pedido-detalhe">Ver detalhes</a>
                        </footer>
                    </li>
                </ul>
            </div>

            <div class="pedidos-acoes">
                <a href="/" class="btn-adicionar">Novo pedido</a>
            </div>
        </section>
    </main>
</body>
</html>
