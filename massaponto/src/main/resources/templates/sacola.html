<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/cabecalho :: head('Sacola - Massa & Ponto')}"></head>
<body>
    <header th:replace="~{fragments/cabecalho :: cabecalho}"></header>

    <!-- SEM chips de categorias na sacola -->

    <main class="principal container-pagina">
        <section class="secao-sacola" aria-labelledby="titulo-sacola">
            <h2 id="titulo-sacola" class="secao-titulo">Sua sacola</h2>

            <div th:if="${sacola.vazia}">
                <div class="sacola-vazia">
                    <p class="sacola-vazia-mensagem">Sua sacola está com fome 🍕</p>
                    <a href="/" class="btn-voltar">Voltar ao cardápio</a>
                </div>
            </div>

            <div th:unless="${sacola.vazia}">
                <ul class="sacola-lista" role="list">
                    <li class="sacola-item" th:each="item, stat : ${sacola.itens}">
                        <div class="sacola-item-info">
                            <h3 class="sacola-item-nome" th:text="${item.produto.nome}"></h3>
                            
                            <p class="sacola-item-observacao" th:if="${item.observacao}" th:text="'Obs: ' + ${item.observacao}"></p>
                            
                            <div class="sacola-item-detalhes">
                                <span class="sacola-item-quantidade">
                                    <label th:for="|qtd-${stat.index}|" class="visually-hidden">Quantidade</label>
                                    <input type="number" th:id="|qtd-${stat.index}|" name="quantidade" th:value="${item.quantidade}" min="1" max="99" class="input-quantidade-pequena" readonly aria-label="Quantidade">
                                </span>
                                <span class="sacola-item-preco" th:text="${item.precoUnitarioFormatado}"></span>
                                <span class="sacola-item-subtotal" th:text="${item.subtotalFormatado}"></span>
                            </div>
                        </div>

                        <div class="sacola-item-acoes">
                            <a th:href="@{/sacola/editar/{indice}(indice=${stat.index})}"
                               class="btn-editar"
                               th:attr="aria-label=|Editar ${item.produto.nome}|, title=|Editar ${item.produto.nome}|">Editar</a>
                            <form method="post" th:action="@{/sacola/remover}" class="sacola-item-acao">
                                <input type="hidden" name="indice" th:value="${stat.index}">
                                <button type="submit" class="btn-remover" th:attr="aria-label=|Remover ${item.produto.nome}|, title=|Remover ${item.produto.nome}|">Remover</button>
                            </form>
                        </div>
                    </li>
                </ul>

                <div class="sacola-resumo">
                    <div class="sacola-total">
                        <span class="sacola-total-label">Total</span>
                        <span class="sacola-total-valor" th:text="${sacola.totalFormatado}"></span>
                    </div>
                    <div class="sacola-acoes">
                        <a href="/" class="btn-voltar">Continuar comprando</a>
                        <a href="/checkout" class="btn-adicionar">Finalizar pedido</a>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
