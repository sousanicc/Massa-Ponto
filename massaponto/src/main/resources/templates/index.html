<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/cabecalho :: head('Massa & Ponto - Pizzaria Artesanal')}"></head>
<body>
    <header th:replace="~{fragments/cabecalho :: cabecalho}"></header>

    <!-- Chips de categorias sticky -->
    <nav class="categorias"
         th:if="${!#lists.isEmpty(pizzasSalgadas) or !#lists.isEmpty(pizzasDoces) or !#lists.isEmpty(bebidas)}"
         role="navigation" aria-label="Categorias do cardápio">
        <div class="categorias-lista">
            <a th:if="${!#lists.isEmpty(pizzasSalgadas)}" href="#pizzas-salgadas" class="categoria-chip">Pizzas Salgadas</a>
            <a th:if="${!#lists.isEmpty(pizzasDoces)}" href="#pizzas-doces" class="categoria-chip">Pizzas Doces</a>
            <a th:if="${!#lists.isEmpty(bebidas)}" href="#bebidas" class="categoria-chip">Bebidas</a>
        </div>
    </nav>

    <main class="principal">
        <!-- Seção Pizzas Salgadas -->
        <section class="secao" id="pizzas-salgadas" th:if="${!#lists.isEmpty(pizzasSalgadas)}" aria-labelledby="titulo-pizzas-salgadas">
            <h2 id="titulo-pizzas-salgadas" class="secao-titulo">Pizzas Salgadas</h2>
            <div class="produtos-grid">
                <article class="produto-card" th:each="produto : ${pizzasSalgadas}">
                    <a th:href="@{/produto/{id}(id=${produto.id})}" class="produto-card-link" th:attr="aria-label=${produto.nome}, title=${produto.nome}">
                        <div class="produto-imagem-wrapper">
                            <img th:if="${produto.imagemSrc}" th:src="${produto.imagemSrc}" th:alt="${produto.nome}" loading="lazy">
                            <div th:unless="${produto.imagemSrc}" class="produto-sem-imagem">Sem imagem</div>
                        </div>
                        <div class="produto-info">
                            <h3 class="produto-nome" th:text="${produto.nome}"></h3>
                            <p class="produto-descricao" th:text="${produto.descricao}"></p>
                            <div class="produto-rodape">
                                <span class="produto-preco" th:text="${produto.precoFormatado}"></span>
                                <span class="btn-adicionar">Adicionar</span>
                            </div>
                        </div>
                    </a>
                </article>
            </div>
        </section>

        <!-- Seção Pizzas Doces -->
        <section class="secao" id="pizzas-doces" th:if="${!#lists.isEmpty(pizzasDoces)}" aria-labelledby="titulo-pizzas-doces">
            <h2 id="titulo-pizzas-doces" class="secao-titulo">Pizzas Doces</h2>
            <div class="produtos-grid">
                <article class="produto-card" th:each="produto : ${pizzasDoces}">
                    <a th:href="@{/produto/{id}(id=${produto.id})}" class="produto-card-link" th:attr="aria-label=${produto.nome}, title=${produto.nome}">
                        <div class="produto-imagem-wrapper">
                            <img th:if="${produto.imagemSrc}" th:src="${produto.imagemSrc}" th:alt="${produto.nome}" loading="lazy">
                            <div th:unless="${produto.imagemSrc}" class="produto-sem-imagem">Sem imagem</div>
                        </div>
                        <div class="produto-info">
                            <h3 class="produto-nome" th:text="${produto.nome}"></h3>
                            <p class="produto-descricao" th:text="${produto.descricao}"></p>
                            <div class="produto-rodape">
                                <span class="produto-preco" th:text="${produto.precoFormatado}"></span>
                                <span class="btn-adicionar">Adicionar</span>
                            </div>
                        </div>
                    </a>
                </article>
            </div>
        </section>

        <!-- Seção Bebidas -->
        <section class="secao" id="bebidas" th:if="${!#lists.isEmpty(bebidas)}" aria-labelledby="titulo-bebidas">
            <h2 id="titulo-bebidas" class="secao-titulo">Bebidas</h2>
            <div class="produtos-grid">
                <article class="produto-card" th:each="produto : ${bebidas}">
                    <a th:href="@{/produto/{id}(id=${produto.id})}" class="produto-card-link" th:attr="aria-label=${produto.nome}, title=${produto.nome}">
                        <div class="produto-imagem-wrapper">
                            <img th:if="${produto.imagemSrc}" th:src="${produto.imagemSrc}" th:alt="${produto.nome}" loading="lazy">
                            <div th:unless="${produto.imagemSrc}" class="produto-sem-imagem">Sem imagem</div>
                        </div>
                        <div class="produto-info">
                            <h3 class="produto-nome" th:text="${produto.nome}"></h3>
                            <p class="produto-descricao" th:text="${produto.descricao}"></p>
                            <div class="produto-rodape">
                                <span class="produto-preco" th:text="${produto.precoFormatado}"></span>
                                <span class="btn-adicionar">Adicionar</span>
                            </div>
                        </div>
                    </a>
                </article>
            </div>
        </section>
    </main>
</body>
</html>
