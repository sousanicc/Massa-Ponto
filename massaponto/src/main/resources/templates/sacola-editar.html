<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/cabecalho :: head('Editar item - Massa & Ponto')}"></head>
<body>
    <header th:replace="~{fragments/cabecalho :: cabecalho}"></header>

    <main class="principal container-pagina">
        <section class="secao-sacola-editar" aria-labelledby="titulo-editar-item">
            <h2 id="titulo-editar-item" class="secao-titulo">Editar item da sacola</h2>

            <div class="sacola-editar-card">
                <h3 class="sacola-editar-produto" th:text="${item.produto.nome}">Produto</h3>

                <form method="post" th:action="@{/sacola/atualizar}" class="form-editar-sacola">
                    <input type="hidden" name="indice" th:value="${indice}">

                    <div class="campo-observacao">
                        <label for="observacao">Observações (opcional)</label>
                        <textarea id="observacao" name="observacao" rows="4"
                                  placeholder="Ex: sem cebola, borda recheada, bem assada..."
                                  th:text="${item.observacao}"></textarea>
                    </div>

                    <div class="campo-quantidade">
                        <label for="quantidade">Quantidade</label>
                        <input type="number" id="quantidade" name="quantidade"
                               th:value="${item.quantidade}" min="1" max="99"
                               class="input-quantidade" required>
                    </div>

                    <div class="sacola-editar-acoes">
                        <button type="submit" class="btn-adicionar">Salvar alterações</button>
                        <a th:href="@{/sacola}" class="btn-voltar">Cancelar</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
