<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Massa &amp; Ponto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- Header sticky -->
    <header class="header" role="banner" th:fragment="cabecalho">
        <div class="header-conteudo">
            <a th:href="@{/}" class="logo" aria-label="Massa & Ponto - Página inicial">
                <span class="logo-parte">Massa</span>
                <span class="logo-e">&amp;</span>
                <span class="logo-parte">Ponto</span>
                <span class="logo-ponto" aria-hidden="true">.</span>
            </a>
            <nav class="header-nav" aria-label="Navegação principal">
                <a th:href="@{/sacola}" class="header-btn header-sacola" aria-label="Ver sacola">
                    <span class="header-sacola-icone" aria-hidden="true">🛒</span>
                    <span class="header-sacola-texto">Sacola</span>
                    <span class="header-sacola-quantidade" th:if="${sacola.quantidadeTotal > 0}" th:text="${sacola.quantidadeTotal}">0</span>
                </a>
                <a th:href="@{/pedidos}" class="header-btn header-pedidos" aria-label="Ver histórico de pedidos">Pedidos</a>
            </nav>
        </div>
    </header>
</body>
</html>
