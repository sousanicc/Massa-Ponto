<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/cabecalho :: head('Admin - Produtos')}"></head>
<body>
    <header th:replace="~{fragments/cabecalho :: cabecalho}"></header>

    <main class="principal container-pagina">
        <section class="secao" aria-labelledby="titulo-admin-produtos">
            <h2 id="titulo-admin-produtos" class="secao-titulo">Gerenciar Produtos</h2>

            <div style="margin-bottom: 1.5rem;">
                <a th:href="@{/admin/produto/cadastro}" class="btn-adicionar"
                   style="display: inline-block; padding: 0.75rem 1.5rem; text-decoration: none;">
                    + Novo Produto
                </a>
            </div>

            <div th:if="${#lists.isEmpty(produtos)}" style="padding: 2rem; text-align: center; color: #888;">
                Nenhum produto cadastrado.
            </div>

            <table th:unless="${#lists.isEmpty(produtos)}"
                   style="width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
                <thead>
                    <tr style="background: #1a1a2e; color: #fff;">
                        <th style="padding: 1rem; text-align: left;">Imagem</th>
                        <th style="padding: 1rem; text-align: left;">Nome</th>
                        <th style="padding: 1rem; text-align: left;">Categoria</th>
                        <th style="padding: 1rem; text-align: left;">Preço</th>
                        <th style="padding: 1rem; text-align: center;">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="produto : ${produtos}" style="border-bottom: 1px solid #eee;">
                        <td style="padding: 0.75rem 1rem;">
                            <img th:if="${produto.imagemSrc}"
                                 th:src="${produto.imagemSrc}"
                                 th:alt="${produto.nome}"
                                 class="admin-produto-miniatura">
                            <span th:unless="${produto.imagemSrc}" class="admin-sem-imagem">—</span>
                        </td>
                        <td style="padding: 0.75rem 1rem;" th:text="${produto.nome}"></td>
                        <td style="padding: 0.75rem 1rem;" th:text="${produto.categoria}"></td>
                        <td style="padding: 0.75rem 1rem;" th:text="${produto.precoFormatado}"></td>
                        <td style="padding: 0.75rem 1rem; text-align: center;">
                            <a th:href="@{/admin/produto/{id}/editar(id=${produto.id})}"
                               style="color: #e67e22; text-decoration: none; margin-right: 1rem;">Editar</a>
                            <form th:action="@{/admin/produto/{id}/deletar(id=${produto.id})}" method="post"
                                  style="display: inline;">
                                <button type="submit"
                                        onclick="return confirm('Tem certeza que deseja excluir este produto?')"
                                        style="background: none; border: none; color: #e74c3c; cursor: pointer; font-size: 1rem;">
                                    Excluir
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
