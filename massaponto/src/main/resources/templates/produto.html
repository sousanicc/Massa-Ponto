<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${produto.nome} + ' - Massa & Ponto'">Produto - Massa & Ponto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- Header sticky (igual ao index.html) -->
    <header class="header" role="banner">
        <div class="header-conteudo">
            <a href="/" class="logo" aria-label="Massa & Ponto - Página inicial">
                <span class="logo-parte">Massa</span>
                <span class="logo-e">&</span>
                <span class="logo-parte">Ponto</span>
                <span class="logo-ponto" aria-hidden="true">.</span>
            </a>
        </div>
    </header>

    <!-- Chips de categorias (igual ao index.html) -->
    <nav class="categorias" role="navigation" aria-label="Categorias do cardápio">
        <div class="categorias-lista">
            <a href="#mais-pedidas" class="categoria-chip">Mais pedidas</a>
            <a href="#pizzas-salgadas" class="categoria-chip">Pizzas Salgadas</a>
            <a href="#pizzas-doces" class="categoria-chip">Pizzas Doces</a>
            <a href="#bebidas" class="categoria-chip">Bebidas</a>
        </div>
    </nav>

    <main class="principal">
        <article class="produto-detalhe">
            <div class="produto-imagem-grande">
                <img th:if="${produto.imagemUrl}" th:src="${produto.imagemUrl}" th:alt="${produto.nome}" loading="lazy">
                <div th:unless="${produto.imagemUrl}" class="produto-sem-imagem">Sem imagem</div>
                <div class="produto-selos">
                    <span th:if="${produto.maisPedida}" class="selo mais-pedida">Mais pedida</span>
                    <span th:if="${produto.vegetariana}" class="selo vegetariana">Vegetariana</span>
                    <span th:if="${produto.picante}" class="selo picante">Picante</span>
                </div>
            </div>

            <div class="produto-info-detalhe">
                <h2 class="produto-nome-detalhe" th:text="${produto.nome}"></h2>

                <div class="etiquetas">
                    <span th:if="${produto.maisPedida}" class="etiqueta mais-pedida">Mais pedida</span>
                    <span th:if="${produto.vegetariana}" class="etiqueta vegetariana">Vegetariana</span>
                    <span th:if="${produto.picante}" class="etiqueta picante">Picante</span>
                </div>

                <p class="descricao-detalhe" th:text="${produto.descricao}"></p>

                <div class="preco-detalhe" th:text="${produto.precoFormatado}"></div>

                <form method="post" th:action="@{/sacola/adicionar}" class="form-adicionar-sacola">
                    <input type="hidden" name="produtoId" th:value="${produto.id}">

                    <div class="campo-observacao">
                        <label for="observacao">Observações (opcional)</label>
                        <textarea id="observacao" name="observacao" rows="4" placeholder="Ex: sem cebola, borda recheada, bem assada..."></textarea>
                    </div>

                    <div class="campo-quantidade">
                        <label for="quantidade">Quantidade</label>
                        <input type="number" id="quantidade" name="quantidade" value="1" min="1" max="99" class="input-quantidade" required>
                    </div>

                    <button type="submit" class="btn-adicionar">Adicionar à sacola</button>
                </form>

                <a href="/" class="btn-voltar">Voltar ao cardápio</a>
            </div>
        </article>
    </main>
</body>
</html>
