<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/cabecalho :: head(${produto.nome} + ' - Massa & Ponto')}"></head>
<body>
    <header th:replace="~{fragments/cabecalho :: cabecalho}"></header>

    <main class="principal">
        <article class="produto-detalhe">
            <div class="produto-imagem-grande">
                <img th:if="${produto.imagemSrc}" th:src="${produto.imagemSrc}" th:alt="${produto.nome}" loading="lazy">
                <div th:unless="${produto.imagemSrc}" class="produto-sem-imagem">Sem imagem</div>
            </div>

            <div class="produto-info-detalhe">
                <h2 class="produto-nome-detalhe" th:text="${produto.nome}"></h2>

                <p class="descricao-detalhe" th:text="${produto.descricao}"></p>

                <div class="preco-detalhe" th:text="${produto.precoFormatado}"></div>

                <form method="post" th:action="@{/sacola/adicionar}" class="form-adicionar-sacola">
                    <input type="hidden" name="produtoId" th:value="${produto.id}">

                    <div class="campo-observacao">
                        <label for="observacao">Observações (opcional)</label>
                        <textarea id="observacao" name="observacao" rows="4" placeholder="Ex: sem cebola, borda recheada, bem assada..."></textarea>
                    </div>

                    <div class="campo-quantidade">
                        <label for="quantidade">Quantidade</label>
                        <input type="number" id="quantidade" name="quantidade" value="1" min="1" max="99" class="input-quantidade" required>
                    </div>

                    <button type="submit" class="btn-adicionar">Adicionar à sacola</button>
                </form>

                <a href="/" class="btn-voltar">Voltar ao cardápio</a>
            </div>
        </article>
    </main>
</body>
</html>
