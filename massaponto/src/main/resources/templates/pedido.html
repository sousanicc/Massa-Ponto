<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Pedido #' + ${pedido.id} + ' - Massa & Ponto'">Pedido - Massa & Ponto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header class="header" role="banner">
        <div class="header-conteudo">
            <a href="/" class="logo" aria-label="Massa & Ponto - Página inicial">
                <span class="logo-parte">Massa</span>
                <span class="logo-e">&</span>
                <span class="logo-parte">Ponto</span>
                <span class="logo-ponto" aria-hidden="true">.</span>
            </a>
            <nav class="header-nav" aria-label="Navegação principal">
                <a href="/sacola" class="header-btn header-sacola" aria-label="Ver sacola">
                    <span class="header-sacola-icone" aria-hidden="true">🛒</span>
                    <span class="header-sacola-texto">Sacola</span>
                    <span class="header-sacola-quantidade" th:if="${sacola.quantidadeTotal > 0}" th:text="${sacola.quantidadeTotal}">0</span>
                </a>
                <a href="/pedidos" class="header-btn header-pedidos" aria-label="Ver histórico de pedidos">Pedidos</a>
            </nav>
        </div>
    </header>

    <main class="principal">
        <section class="secao-pedido" aria-labelledby="titulo-pedido">
            <header class="pedido-cabecalho">
                <h2 id="titulo-pedido" class="secao-titulo">Pedido confirmado</h2>
                <div class="pedido-meta">
                    <span class="pedido-numero" th:text="'#' + ${pedido.id}">#123</span>
                    <span class="pedido-data" th:text="${pedido.criadoEmFormatado}">25/11/2024 19:30</span>
                    <span class="pedido-forma" th:text="${pedido.formaPagamento?.getNomeExibicao()}">Pix</span>
                </div>
            </header>

            <!-- Comprovante (vem do flash) -->
            <div th:if="${comprovante}" class="pedido-comprovante" th:text="${comprovante}"></div>

            <div class="pedido-itens">
                <h3>Itens do pedido</h3>
                <ul class="pedido-lista" role="list">
                    <li class="pedido-item" th:each="item : ${pedido.itens}">
                        <div class="pedido-item-info">
                            <span class="pedido-item-nome" th:text="${item.produto?.nome ?: 'Produto removido'}">Nome do produto</span>
                            <span class="pedido-item-qtd" th:text="${item.quantidade} + 'x'">1x</span>
                            <span class="pedido-item-obs" th:if="${item.observacao}" th:text="'Obs: ' + ${item.observacao}"></span>
                        </div>
                        <span class="pedido-item-subtotal" th:text="${item.subtotalFormatado}">R$ 45,00</span>
                    </li>
                </ul>
            </div>

            <div class="pedido-total">
                <span class="pedido-total-label">Total</span>
                <span class="pedido-total-valor" th:text="${pedido.totalFormatado}">R$ 45,00</span>
            </div>

            <div class="pedido-acoes">
                <a href="/pedidos" class="btn-voltar">Ver histórico</a>
                <a href="/" class="btn-adicionar">Novo pedido</a>
            </div>
        </section>
    </main>
</body>
</html>
