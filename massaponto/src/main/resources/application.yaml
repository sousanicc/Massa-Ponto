server:
  # No Render a porta vem na variável PORT; localmente continua 8081
  port: ${PORT:8081}

spring:
  datasource:
    # Valores padrão = ambiente local. No Render, defina DB_URL, DB_USER e DB_PASSWORD.
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/massapontodb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:525896}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.postgres.sql
      data-locations: classpath:data.postgres.sql

